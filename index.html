    <style>
        /* Põhiline lehe stiil ja taust */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background: #ffffff;
            line-height: 1.6;
        }

        /* Pealkirjad */
        h1 { 
            text-align: center; 
            color: #2c3e50; 
            font-size: 32px; 
            margin-bottom: 30px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
        }
        h2 {
            color: #2c3e50;
        }

        /* Sektsioonide vahed */
        .menu, .game { margin-top: 20px; }
        
        p {
            font-size: 18px;
            margin-bottom: 10px;
        }

        /* Nupud */
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 20px;
            margin: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }
        button:hover { background-color: #2980b9; }
        
        .secondary-btn { background-color: #95a5a6; }
        .secondary-btn:hover { background-color: #7f8c8d; }

        /* Valikmenüüd (select) */
        select {
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            font-size: 18px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            background-color: #fdfdfd;
        }

        /* Tekstisisestusväli */
        input[type="text"] {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            box-sizing: border-box;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            font-size: 20px;
            transition: border-color 0.2s ease;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }

        /* 4-variandiga valikute ruudustik */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        .option-btn {
            background-color: #2ecc71;
            font-size: 18px;
            padding: 20px;
            border-radius: 8px;
        }
        .option-btn:hover { background-color: #27ae60; }

        /* Utiliit-klassid */
        .hidden { display: none; }
        
        /* Statistika ja tagasiside mängu ajal */
        #stats { 
            font-size: 18px;
            font-weight: bold; 
            margin-bottom: 20px; 
            color: #7f8c8d;
            text-align: center;
        }
        #feedback { 
            font-weight: bold; 
            margin-top: 15px; 
            font-size: 22px; 
            min-height: 30px; 
            text-align: center;
        }

        /* Häälduse nupp */
        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
            padding: 0 10px;
            width: auto;
            display: inline;
            color: #3498db;
        }
        .audio-btn:hover {
            background: none;
            transform: scale(1.1);
        }

        /* Küsimuse tekst */
        #question-text {
            font-size: 24px !important;
            color: #2c3e50;
        }

        /* Printimise stiilid */
        @media print {
            body { 
                background: #fff; 
                box-shadow: none; 
                margin: 0; 
                padding: 0;
                max-width: 100%; 
            }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        
        .print-only { display: none; }
        
        table.print-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            font-size: 16px;
        }
        table.print-table th, table.print-table td { 
            border: 1px solid #333; 
            padding: 10px; 
            line-height: 1.5; 
            text-align: left; 
            vertical-align: middle; 
        }
        .write-cell {
            width: 50%;
        }
    </style>
