<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sõnade Testija</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; max-width: 600px; margin: 20px auto; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-top: 0; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
        .secondary-btn { background: #95a5a6; }
        .secondary-btn:hover { background: #7f8c8d; }
        .hidden { display: none; }
        #feedback { text-align: center; font-weight: bold; font-size: 18px; margin-top: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .audio-btn { background: none; border: none; cursor: pointer; font-size: 24px; width: auto; display: inline; color: #3498db; padding: 0 8px; }
        #status-msg { color: #d35400; font-weight: bold; text-align: center; margin-bottom: 10px; }
        
        .range-container { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
        .range-container input { width: 50%; text-align: center; margin: 0; }
        
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: #fff; margin: 0; padding: 0; max-width: 100%; }
        }
        .print-only { display: none; }
        table.print-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table.print-table th, table.print-table td { border: 1px solid #333; padding: 10px; text-align: left; }
    </style>
</head>
<body>
    <div class="card no-print">
        <h1>Sõnade Testija</h1>
        <div id="status-msg">Laen andmeid...</div>

        <div id="menu" class="hidden">
            <label><strong>Vali raamat:</strong></label>
            <select id="book-select" onchange="updateUnits()"></select>

            <label><strong>Vali osa (Unit):</strong></label>
            <select id="unit-select" onchange="updateTotalInfo()"></select>

            <label><strong>Sõnade vahemik:</strong> <span id="total-words-info" style="color: #666; font-size: 14px;"></span></label>
            <select id="range-type" onchange="toggleCustomRange()">
                <option value="custom">Ise valitud vahemik</option>
                <option value="all">Kõik uniti sõnad</option>
            </select>

            <div id="custom-range-box" class="range-container">
                <input type="number" id="range-start" value="1" min="1" placeholder="Algus (nt 1)">
                <span>kuni</span>
                <input type="number" id="range-end" value="10" min="1" placeholder="Lõpp (nt 10)">
            </div>

            <label><strong>Režiim:</strong></label>
            <select id="mode-select">
                <option value="choice-ee">Valikvastused - 4 varianti (ENG -> EST)</option>
                <option value="choice-en">Valikvastused - 4 varianti (EST -> ENG)</option>
                <option value="write-ee">Kirjutamine (ENG -> EST)</option>
                <option value="write-en">Kirjutamine (EST -> ENG)</option>
            </select>

            <button onclick="startTest()">Alusta testi</button>
            <button class="secondary-btn" onclick="openPrintView()">Prindi tööleht</button>
        </div>

        <div id="game" class="hidden">
            <div id="progress" style="text-align: center; color: #666;"></div>
            <h2 style="text-align: center;">
                <span id="question"></span>
                <button class="audio-btn" onclick="speakWord()" title="Kuula">🔊</button>
            </h2>

            <div id="write-box">
                <input type="text" id="answer-input" placeholder="Kirjuta vastus..." autocomplete="off">
                <button onclick="checkAnswer()">Kinnita</button>
            </div>

            <div id="choice-box" class="grid hidden"></div>

            <div id="feedback"></div>
            <button id="next-btn" class="hidden" onclick="nextQuestion()">Järgmine</button>
            <button class="secondary-btn" onclick="showMenu()" style="margin-top: 15px;">Tagasi menüüsse</button>
        </div>
    </div>

    <!-- Printimise vaade -->
    <div id="print-area" class="print-only">
        <h2>Sõnade tööleht</h2>
        <table class="print-table">
            <thead>
                <tr>
                    <th>Sõna / Väljend</th>
                    <th>Tõlge</th>
                </tr>
            </thead>
            <tbody id="print-table-body"></tbody>
        </table>
    </div>

    <script>
        var DATA = {};
        var words = [];
        var index = 0;
        var score = 0;
        var mode = '';
        var currentAudioWord = '';

        // Laeme words.json faili
        fetch('words.json')
            .then(function(response) {
                if (!response.ok) throw new Error("Faili words.json ei leitud!");
                return response.json();
            })
            .then(function(data) {
                DATA = data;
                document.getElementById('status-msg').classList.add('hidden');
                document.getElementById('menu').classList.remove('hidden');
                initBooks();
            })
            .catch(function(err) {
                document.getElementById('status-msg').textContent = '⚠️ Viga andmete laadimisel! Veendu, et words.json on samas kaustas.';
                console.error(err);
            });

        function initBooks() {
            var bSelect = document.getElementById('book-select');
            bSelect.innerHTML = '';
            for (var bookKey in DATA) {
                var opt = document.createElement('option');
                opt.value = bookKey;
                opt.textContent = bookKey.toUpperCase().replace('BOOK', 'Book ');
                bSelect.appendChild(opt);
            }
            updateUnits();
        }

        function updateUnits() {
            var b = document.getElementById('book-select').value;
            var uSelect = document.getElementById('unit-select');
            uSelect.innerHTML = '<option value="all">Kõik unitid koos</option>';
            
            if (DATA[b]) {
                for (var u in DATA[b]) {
                    var opt = document.createElement('option');
                    opt.value = u;
                    var unitObj = DATA[b][u];
                    
                    // Puhastame nime: ei lisa automaatselt sõna "Unit", kasuta otse nime või võtit
                    var displayName = (unitObj && unitObj.name) ? unitObj.name : u;
                    
                    // Eemaldame igaks juhuks dubleeritud "Unit Unit" juhul kui see pärineb nimekujust
                    displayName = displayName.replace(/^Unit\s+Unit/i, 'Unit');

                    opt.textContent = displayName;
                    uSelect.appendChild(opt);
                }
            }
            updateTotalInfo();
        }

        function updateTotalInfo() {
            var b = document.getElementById('book-select').value;
            var u = document.getElementById('unit-select').value;
            var dict = getSelectedDict(b, u);
            var total = Object.keys(dict).length;
            
            document.getElementById('total-words-info').textContent = '(Kokku: ' + total + ' sõna)';
            document.getElementById('range-end').value = Math.min(10, total);
            document.getElementById('range-start').value = 1;
        }

        function toggleCustomRange() {
            var type = document.getElementById('range-type').value;
            var box = document.getElementById('custom-range-box');
            if (type === 'custom') {
                box.classList.remove('hidden');
            } else {
                box.classList.add('hidden');
            }
        }

        function getSelectedDict(b, u) {
            var dict = {};
            if (!DATA[b]) return dict;

            if (u === 'all') {
                for (var unitKey in DATA[b]) {
                    var uData = DATA[b][unitKey];
                    if (uData) {
                        var w = uData.words || uData;
                        for (var k in w) {
                            if (k !== 'name') dict[k] = w[k];
                        }
                    }
                }
            } else if (DATA[b][u]) {
                var uData = DATA[b][u];
                var w = uData.words || uData;
                for (var k in w) {
                    if (k !== 'name') dict[k] = w[k];
                }
            }
            return dict;
        }

        function getEntriesForTest() {
            var b = document.getElementById('book-select').value;
            var u = document.getElementById('unit-select').value;
            var dict = getSelectedDict(b, u);
            var allEntries = Object.entries(dict);
            var rangeType = document.getElementById('range-type').value;

            if (rangeType === 'custom') {
                var start = parseInt(document.getElementById('range-start').value) || 1;
                var end = parseInt(document.getElementById('range-end').value) || allEntries.length;
                
                start = Math.max(1, start) - 1;
                end = Math.min(allEntries.length, end);

                if (start >= end) {
                    alert("Algusnäitaja peab olema väiksem kui lõppnäitaja!");
                    return null;
                }
                return allEntries.slice(start, end);
            }
            return allEntries;
        }

        function startTest() {
            mode = document.getElementById('mode-select').value;
            var entries = getEntriesForTest();

            if (!entries) return;

            words = entries.sort(function() { return Math.random() - 0.5; });

            if (words.length === 0) {
                alert("Valitud osas või vahemikus puuduvad sõnad!");
                return;
            }

            index = 0;
            score = 0;

            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');

            document.getElementById('answer-input').onkeypress = function(e) {
                if (e.key === 'Enter') checkAnswer();
            };

            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById('feedback').textContent = '';
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').disabled = false;

            var curr = words[index];
            var isEE = mode.endsWith('-ee');
            
            currentAudioWord = isEE ? curr[0] : curr[1];
            document.getElementById('question').textContent = isEE ? curr[0] : curr[1];
            document.getElementById('progress').textContent = 'Küsimus ' + (index + 1) + ' / ' + words.length + ' | Punkte: ' + score;

            if (mode.startsWith('write')) {
                document.getElementById('write-box').classList.remove('hidden');
                document.getElementById('choice-box').classList.add('hidden');
                document.getElementById('answer-input').focus();
            } else {
                document.getElementById('write-box').classList.add('hidden');
                document.getElementById('choice-box').classList.remove('hidden');
                makeChoices(isEE ? curr[1] : curr[0], isEE);
            }
        }

        function makeChoices(correct, isEE) {
            var box = document.getElementById('choice-box');
            box.innerHTML = '';
            
            var b = document.getElementById('book-select').value;
            var u = document.getElementById('unit-select').value;
            var fullDict = getSelectedDict(b, u);
            var allAnswers = Object.entries(fullDict).map(function(w) { return isEE ? w[1] : w[0]; });

            var options = [correct];
            
            while (options.length < 4 && options.length < allAnswers.length) {
                var rand = allAnswers[Math.floor(Math.random() * allAnswers.length)];
                if (options.indexOf(rand) === -1) {
                    options.push(rand);
                }
            }
            
            options.sort(function() { return Math.random() - 0.5; });

            options.forEach(function(opt) {
                var btn = document.createElement('button');
                btn.textContent = opt;
                btn.onclick = function() { validate(opt === correct, correct); };
                box.appendChild(btn);
            });
        }

        function checkAnswer() {
            var input = document.getElementById('answer-input');
            if (input.disabled) return;
            input.disabled = true;

            var user = input.value.trim().toLowerCase();
            var isEE = mode.endsWith('-ee');
            var correct = isEE ? words[index][1] : words[index][0];

            validate(user === correct.toLowerCase(), correct);
        }

        function validate(isCorrect, correct) {
            var fb = document.getElementById('feedback');
            var btns = document.querySelectorAll('#choice-box button');
            btns.forEach(function(b) { b.disabled = true; });

            if (isCorrect) {
                score++;
                fb.textContent = '✅ Õige!';
                fb.style.color = 'green';
            } else {
                fb.textContent = '❌ Vale! Õige: ' + correct;
                fb.style.color = 'red';
            }
            document.getElementById('next-btn').classList.remove('hidden');
            document.getElementById('next-btn').focus();
        }

        function nextQuestion() {
            index++;
            if (index < words.length) {
                loadQuestion();
            } else {
                document.getElementById('question').textContent = 'Test lõpetatud!';
                document.getElementById('write-box').classList.add('hidden');
                document.getElementById('choice-box').classList.add('hidden');
                document.getElementById('feedback').textContent = 'Tulemus: ' + score + ' / ' + words.length;
                document.getElementById('feedback').style.color = '#333';
                document.getElementById('next-btn').classList.add('hidden');
            }
        }

        function speakWord() {
            if ('speechSynthesis' in window) {
                var utterance = new SpeechSynthesisUtterance(currentAudioWord);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        function showMenu() {
            document.getElementById('game').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
        }

        function openPrintView() {
            var entries = getEntriesForTest();
            if (!entries) return;

            var tbody = document.getElementById('print-table-body');
            tbody.innerHTML = '';
            entries.forEach(function(pair) {
                var tr = document.createElement('tr');
                tr.innerHTML = '<td><strong>' + pair[0] + '</strong></td><td>' + pair[1] + '</td>';
                tbody.appendChild(tr);
            });
            window.print();
        }
    </script>
</body>
</html>
