<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sõnade Testija</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background: #ffffff;
            line-height: 1.6;
        }
        h1 { 
            text-align: center; 
            color: #2c3e50; 
            font-size: 32px; 
            margin-bottom: 30px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
        }
        .menu, .game { margin-top: 20px; }
        p { font-size: 18px; margin-bottom: 10px; }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 20px;
            margin: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        .secondary-btn { background-color: #95a5a6; }
        select, input[type="text"] {
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            font-size: 18px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        .option-btn { background-color: #2ecc71; padding: 20px; }
        .hidden { display: none; }
        #stats { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #7f8c8d; text-align: center; }
        #feedback { font-weight: bold; margin-top: 15px; font-size: 22px; min-height: 30px; text-align: center; }
        .audio-btn { background: none; border: none; cursor: pointer; font-size: 24px; width: auto; display: inline; color: #3498db; }
        #question-text { font-size: 24px; color: #2c3e50; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: #fff; box-shadow: none; margin: 0; padding: 0; max-width: 100%; }
        }
        .print-only { display: none; }
        table.print-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table.print-table th, table.print-table td { border: 1px solid #333; padding: 10px; text-align: left; }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>Sõnade Testija</h1>

        <div id="menu" class="menu">
            <label for="book-select"><strong>Vali raamat:</strong></label>
            <select id="book-select" onchange="updateUnitSelect()">
                <option value="book1">Inglise keel 1</option>
                <option value="book2">Inglise keel 2</option>
            </select>

            <label for="unit-select"><strong>Vali osa (Unit):</strong></label>
            <select id="unit-select"></select>

            <label for="mode-select"><strong>Testi tüüp:</strong></label>
            <select id="mode-select">
                <option value="write-ee">Kirjuta eesti keeles (ENG -> EST)</option>
                <option value="write-en">Kirjuta inglise keeles (EST -> ENG)</option>
                <option value="choice-ee">Valikvastused (ENG -> EST)</option>
                <option value="choice-en">Valikvastused (EST -> ENG)</option>
            </select>

            <button onclick="startTest()">Alusta testi</button>
            <button class="secondary-btn" onclick="openPrintView()">Prindi tööleht</button>
        </div>

        <div id="game" class="game hidden">
            <div id="stats"></div>
            <p>
                <span id="question-text"></span>
                <button class="audio-btn" onclick="speakWord()" title="Kuula hääldust">🔊</button>
            </p>

            <div id="write-container">
                <input type="text" id="answer-input" placeholder="Kirjuta vastus siia..." autocomplete="off">
                <button onclick="checkWriteAnswer()">Kinnita vastus</button>
            </div>

            <div id="choice-container" class="options-grid hidden"></div>

            <div id="feedback"></div>
            <button id="next-btn" class="hidden" onclick="nextQuestion()">Järgmine küsimus</button>
            <button class="secondary-btn" onclick="showMenu()" style="margin-top: 20px;">Tagasi menüüsse</button>
        </div>
    </div>

    <div id="print-area" class="print-only">
        <h2>Sõnade tööleht</h2>
        <table class="print-table">
            <thead>
                <tr>
                    <th>Sõna / Väljend</th>
                    <th>Tõlge / Kirjutusruum</th>
                </tr>
            </thead>
            <tbody id="print-table-body"></tbody>
        </table>
    </div>

    <script>
        var CURRICULUM = {
            book1: {
                1: { name: "Unit 1", words: { "apple": "õun", "banana": "banaan", "cat": "kass", "dog": "koer", "house": "maja" } },
                2: { name: "Unit 2", words: { "red": "punane", "blue": "sinine", "green": "roheline", "yellow": "kollane" } }
            },
            book2: {
                1: { name: "Unit 1", words: { "family": "pere", "mother": "ema", "father": "isa", "brother": "vend", "sister": "õde" } },
                2: { name: "Unit 2", words: { "school": "kool", "teacher": "õpetaja", "book": "raamat", "pen": "pliiats" } }
            }
        };

        var currentWords = [];
        var currentIndex = 0;
        var score = 0;
        var currentMode = '';
        var currentTargetWord = '';

        function updateUnitSelect() {
            var bookKey = document.getElementById('book-select').value;
            var unitSelect = document.getElementById('unit-select');
            unitSelect.innerHTML = '<option value="all">Kõik unitid koos</option>';
            var units = CURRICULUM[bookKey];
            for (var u in units) {
                var opt = document.createElement('option');
                opt.value = u;
                opt.textContent = units[u].name;
                unitSelect.appendChild(opt);
            }
        }

        function startTest() {
            var bookKey = document.getElementById('book-select').value;
            var unitVal = document.getElementById('unit-select').value;
            currentMode = document.getElementById('mode-select').value;

            var sourceDict = {};
            if (unitVal === 'all') {
                for (var u in CURRICULUM[bookKey]) {
                    Object.assign(sourceDict, CURRICULUM[bookKey][u].words);
                }
            } else {
                sourceDict = CURRICULUM[bookKey][unitVal].words;
            }

            currentWords = Object.entries(sourceDict);
            if (currentWords.length === 0) {
                alert("Selles osas puuduvad sõnad!");
                return;
            }

            currentWords.sort(function() { return Math.random() - 0.5; });
            currentIndex = 0;
            score = 0;

            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');

            showQuestion();
        }

        function showQuestion() {
            document.getElementById('feedback').textContent = '';
            document.getElementById('next-btn').classList.add('hidden');
            
            var item = currentWords[currentIndex];
            var eng = item[0];
            var est = item[1];
            var isToEE = currentMode.endsWith('-ee');
            
            currentTargetWord = isToEE ? eng : est;

            document.getElementById('question-text').textContent = isToEE ? eng : est;
            document.getElementById('stats').textContent = 'Küsimus ' + (currentIndex + 1) + ' / ' + currentWords.length + ' | Punkte: ' + score;

            if (currentMode.startsWith('write')) {
                document.getElementById('write-container').classList.remove('hidden');
                document.getElementById('choice-container').classList.add('hidden');
                var input = document.getElementById('answer-input');
                input.value = '';
                input.disabled = false;
                input.focus();
            } else {
                document.getElementById('write-container').classList.add('hidden');
                document.getElementById('choice-container').classList.remove('hidden');
                generateChoices(isToEE ? est : eng, isToEE);
            }
        }

        function generateChoices(correctAnswer, isToEE) {
            var container = document.getElementById('choice-container');
            container.innerHTML = '';

            var allAnswers = currentWords.map(function(item) { return isToEE ? item[1] : item[0]; });
            var choices = [correctAnswer];

            while (choices.length < 4 && choices.length < allAnswers.length) {
                var randomAns = allAnswers[Math.floor(Math.random() * allAnswers.length)];
                if (choices.indexOf(randomAns) === -1) {
                    choices.push(randomAns);
                }
            }

            choices.sort(function() { return Math.random() - 0.5; });

            choices.forEach(function(choice) {
                var btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = choice;
                btn.onclick = function() { checkChoiceAnswer(choice, correctAnswer); };
                container.appendChild(btn);
            });
        }

        function checkWriteAnswer() {
            var input = document.getElementById('answer-input');
            if (input.disabled) return;

            var userAns = input.value.trim().toLowerCase();
            var item = currentWords[currentIndex];
            var correctAns = currentMode.endsWith('-ee') ? item[1] : item[0];

            input.disabled = true;

            if (userAns === correctAns.toLowerCase()) {
                score++;
                document.getElementById('feedback').textContent = '✅ Õige!';
                document.getElementById('feedback').style.color = '#2ecc71';
            } else {
                document.getElementById('feedback').textContent = '❌ Vale! Õige vastus: ' + correctAns;
                document.getElementById('feedback').style.color = '#e74c3c';
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function checkChoiceAnswer(selected, correct) {
            var buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(function(b) { b.disabled = true; });

            if (selected === correct) {
                score++;
                document.getElementById('feedback').textContent = '✅ Õige!';
                document.getElementById('feedback').style.color = '#2ecc71';
            } else {
                document.getElementById('feedback').textContent = '❌ Vale! Õige vastus: ' + correct;
                document.getElementById('feedback').style.color = '#e74c3c';
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentWords.length) {
                showQuestion();
            } else {
                document.getElementById('question-text').textContent = 'Test lõpetatud!';
                document.getElementById('write-container').classList.add('hidden');
                document.getElementById('choice-container').classList.add('hidden');
                document.getElementById('feedback').textContent = 'Sinu lõpptulemus: ' + score + ' / ' + currentWords.length;
                document.getElementById('feedback').style.color = '#2c3e50';
                document.getElementById('next-btn').classList.add('hidden');
            }
        }

        function speakWord() {
            if ('speechSynthesis' in window) {
                var utterance = new SpeechSynthesisUtterance(currentTargetWord);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        function showMenu() {
            document.getElementById('game').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
        }

        function openPrintView() {
            var bookKey = document.getElementById('book-select').value;
            var unitVal = document.getElementById('unit-select').value;

            var sourceDict = {};
            if (unitVal === 'all') {
                for (var u in CURRICULUM[bookKey]) {
                    Object.assign(sourceDict, CURRICULUM[bookKey][u].words);
                }
            } else {
                sourceDict = CURRICULUM[bookKey][unitVal].words;
            }

            var tableBody = document.getElementById('print-table-body');
            tableBody.innerHTML = '';

            for (var eng in sourceDict) {
                var tr = document.createElement('tr');
                tr.innerHTML = '<td><strong>' + eng + '</strong></td><td>' + sourceDict[eng] + '</td>';
                tableBody.appendChild(tr);
            }

            window.print();
        }

        // Käivitame valiku
        updateUnitSelect();
    </script>
</body>
</html>
